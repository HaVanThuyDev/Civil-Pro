server:
  port: 8000

spring:
  application:
    name: gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      httpclient:
        ssl:
          use-insecure-trust-manager: true

      routes:
        - id: block-actuator
          uri: no://op
          predicates:
            - Path=/actuator/**
          filters:
            - name: SetStatus
              args:
                status: 403

        - id: auth-service
          uri: lb://CIVIL-PRO-AUTH
          predicates:
            - Path=/civil/auth/**, /civil/auth, /civil/users/**, /civil/users
          filters:
            - RewritePath=/civil/(?<segment>.*), /${segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@authKeyResolver}"

        - id: citizen-service
          uri: lb://CIVIL-PRO-CITIZEN
          predicates:
            - Path=/civil/citizen/**, /civil/citizen
          filters:
            - RewritePath=/civil/citizen(?<segment>.*), /api/citizen${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

        - id: household-service
          uri: lb://HOUSEHOLD-SERVICE
          predicates:
            - Path=/civil/household/**, /civil/household
          filters:
            - RewritePath=/civil/household(?<segment>.*), /api/household${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

        - id: fluctuations-service
          uri: lb://FLUCTUATIONS-SERVICE
          predicates:
            - Path=/civil/fluctuations/**, /civil/fluctuations
          filters:
            - RewritePath=/civil/fluctuations(?<segment>.*), /api/fluctuations${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

        - id: statistical-service
          uri: lb://STATISTICAL-SERVICE
          predicates:
            - Path=/civil/statistical/**, /civil/statistical
          filters:
            - RewritePath=/civil/statistical(?<segment>.*), /api/statistical${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

        - id: synchronized-service
          uri: lb://SYNCHRONIZED-SERVICE
          predicates:
            - Path=/civil/synchronized/**, /civil/synchronized
          filters:
            - RewritePath=/civil/synchronized(?<segment>.*), /api/sync${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

        - id: vnpay-service
          uri: lb://VNPAY-SERVICE
          predicates:
            - Path=/civil/vnpay/**, /civil/vnpay
          filters:
            - RewritePath=/civil/(?<segment>.*), /${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

        - id: payment-process-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/civil/pay/process
          filters:
            - RewritePath=/civil/pay(?<segment>.*), /api/pay${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                key-resolver: "#{@paymentKeyResolver}"

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/civil/pay/**, /civil/pay
          filters:
            - RewritePath=/civil/pay(?<segment>.*), /api/pay${segment}
            - name: JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@authKeyResolver}"

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://registry:8761/eureka/}}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

civil-pro:
  jwt:
    secret: my-secret-key-123456789012345678901234
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty: INFO
