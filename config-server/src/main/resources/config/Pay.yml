server:
  port: 8089

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/DB_PAYMENT?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: ${MYSQL_PASSWORD:11032003}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Payment-HikariPool
      maximum-pool-size: 10
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

civil-pro:
  jwt:
    secret: my-secret-key-123456789012345678901234
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000
  kafka:
    topics:
      payment-events: payment.events

grpc:
  server:
    port: 9089
  client:
    auth-service:
      address: discovery:///civil-pro-auth
      enable-keep-alive: true
      keep-alive-without-calls: true
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    vn.civilpro: DEBUG
    org.springframework.security: WARN
