server:
  port: 5000

spring:
  application:
    name: civil-pro-citizen

  datasource:
    url: jdbc:mysql://localhost:3306/DB_CONG_DAN?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 11032003
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: Auth-HikariPool
      maximum-pool-size: 10
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:civil-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

civil-pro:
  jwt:
    secret: my-secret-key-1234567890123456789012348
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://registry:8761/eureka/}}
  instance:
    prefer-ip-address: true

grpc:
  server:
    port: 9101

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

