name: Civil-Pro CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Continuous Integration: Biên dịch & Kiểm tra toàn diện ──
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Package All Maven Modules
        run: mvn clean package -DskipTests

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images (Local Validation)
        run: docker compose build

  # ── 2. Continuous Deployment: Đóng gói & Push lên Docker Hub ───
  deploy-docker:
    name: Push Images to Docker Hub
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package JAR Files
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning ::DOCKERHUB_USERNAME hoặc DOCKERHUB_TOKEN chưa được cấu hình trong Secrets. Bỏ qua bước đẩy Docker Images."
          fi

      - name: Log in to Docker Hub
        if: steps.check-secrets.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Microservice Images
        if: steps.check-secrets.outputs.has_creds == 'true'
        run: |
          SERVICES=(
            "config-server:config-server"
            "registry:registry"
            "civil-pro-gateway:gateway"
            "civil-pro-auth:auth"
            "civil-pro-citizen:citizen"
            "civil-pro-household:household"
            "civil-pro-fluctuations:fluctuations"
            "civil-pro-pay:pay"
            "civil-pro-synchronized:synchronized"
            "civil-pro-statistical:statistical"
          )

          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          COMMIT_SHA="${{ github.sha }}"

          for item in "${SERVICES[@]}"; do
            DIR="${item%%:*}"
            NAME="${item##*:}"
            IMAGE_TAG="$DOCKER_USER/civil-pro-$NAME"

            echo "=========================================================="
            echo "Building & Pushing: $IMAGE_TAG"
            echo "=========================================================="

            docker build -t "$IMAGE_TAG:latest" -t "$IMAGE_TAG:$COMMIT_SHA" "./$DIR"
            docker push "$IMAGE_TAG:latest"
            docker push "$IMAGE_TAG:$COMMIT_SHA"
          done
