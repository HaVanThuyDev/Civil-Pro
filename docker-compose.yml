networks:
  civil-network:
    driver: bridge
    name: civil-network

volumes:
  mysql_data:
    name: civil_mysql_data
  redis_data:
    name: civil_redis_data
  kafka_data:
    name: civil_kafka_data

services:
  # ── Infrastructure ──────────────────────────────────────────────
  civil-mysql:
    image: mysql:8.0
    container_name: civil-mysql
    hostname: civil-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "11032003"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p11032003"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  civil-redis:
    image: redis:7.2-alpine
    container_name: civil-redis
    hostname: civil-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - civil-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - civil-network

  # ── 1. Config Server (starts FIRST, no dependencies on registry) ──
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: civil-pro/config-server:1.0.0
    container_name: config-server
    hostname: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-server
      SPRING_PROFILES_ACTIVE: native
    networks:
      - civil-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ── 2. Eureka Registry (starts AFTER config-server is healthy) ──
  registry:
    build:
      context: ./registry
      dockerfile: Dockerfile
    image: civil-pro/registry:1.0.0
    container_name: registry
    hostname: registry
    restart: unless-stopped
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: registry
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - civil-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ── 3. Gateway (starts AFTER config-server + registry are healthy) ──
  civil-pro-gateway:
    build:
      context: ./civil-pro-gateway
      dockerfile: Dockerfile
    image: civil-pro/gateway:1.0.0
    container_name: civil-pro-gateway
    hostname: civil-pro-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      config-server:
        condition: service_healthy
      registry:
        condition: service_healthy
      civil-redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: gateway
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://registry:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
      SPRING_DATA_REDIS_HOST: civil-redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - civil-network

  # ── 4. Auth Service ──
  civil-pro-auth:
    build:
      context: ./civil-pro-auth
      dockerfile: Dockerfile
    image: civil-pro/auth:1.0.0
    container_name: civil-pro-auth
    hostname: civil-pro-auth
    restart: unless-stopped
    ports:
      - "8091:6000"
      - "9081:9102"
    depends_on:
      config-server:
        condition: service_healthy
      registry:
        condition: service_healthy
      civil-mysql:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: civil-pro-auth
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://registry:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/db_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "11032003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - civil-network

  # ── 5. Citizen Service ──
  civil-pro-citizen:
    build:
      context: ./civil-pro-citizen
      dockerfile: Dockerfile
    image: civil-pro/citizen:1.0.0
    container_name: civil-pro-citizen
    hostname: civil-pro-citizen
    restart: unless-stopped
    ports:
      - "8082:5000"
      - "9084:9101"
    depends_on:
      config-server:
        condition: service_healthy
      registry:
        condition: service_healthy
      civil-mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: civil-pro-citizen
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://registry:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/db_cong_dan?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "11032003"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - civil-network

  # ── 6. Household Service ──
  civil-pro-household:
