      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://registry:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/db_ho_khau?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "11032003"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    extra_hosts:
