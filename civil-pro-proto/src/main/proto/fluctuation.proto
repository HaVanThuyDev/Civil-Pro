syntax = "proto3";

// ================================================================
// CIVIL-PRO — POPULATION FLUCTUATION SERVICE PROTO
//
// Caller  : StatisticalService, SynchronizationService
// Provider: civil-pro-fluctuations (gRPC port 9085)
// ================================================================

package civilpro.fluctuation;

option java_multiple_files  = true;
option java_package         = "vn.civil.grpc.fluctuation";
option java_outer_classname = "FluctuationProto";

import "common.proto";

// ================================================================
// DATA MESSAGES
// ================================================================

// A single population fluctuation record
message FluctuationInfo {
    int64  id               = 1;
    string fluctuation_code = 2;
    string fluctuation_type = 3;   // BIRTH, DEATH, IMMIGRATION, EMIGRATION, INTERNAL_MIGRATION
    int64  citizen_id       = 4;   // 0 if record not yet created (e.g. newborn)
    string full_name        = 5;
    string area_code        = 6;
    string fluctuation_date = 7;   // ISO: yyyy-MM-dd
    int32  month            = 8;
    int32  year             = 9;
    string description      = 10;
}

// Monthly aggregated fluctuation (used for Dashboard line chart)
message MonthlyFluctuationSummary {
    string area_code         = 1;
    int32  month             = 2;
    int32  year              = 3;
    int64  birth_count       = 4;
    int64  death_count       = 5;
    int64  immigration_count = 6;
    int64  emigration_count  = 7;
    int64  growth_count      = 8;  // birth - death + immigration - emigration
}

// ================================================================
// REQUEST MESSAGES
// ================================================================

message GetMonthlyFluctuationsRequest {
    string area_code  = 1;   // Empty = entire province
    int32  year       = 2;
    int32  from_month = 3;   // 1-12
    int32  to_month   = 4;   // 1-12
}

message GetFluctuationsRequest {
    string area_code                     = 1;
    string fluctuation_type              = 2;   // Empty = all types
    civilpro.common.DateRange date_range = 3;
    civilpro.common.PageRequest page     = 4;
}

message GetAnnualBirthDeathRequest {
    string area_code = 1;
    int32  year      = 2;
}

// ================================================================
// RESPONSE MESSAGES
// ================================================================

message GetMonthlyFluctuationsResponse {
    civilpro.common.GrpcResponse            meta = 1;
    repeated MonthlyFluctuationSummary      data = 2;
}

message GetFluctuationsResponse {
    civilpro.common.GrpcResponse meta = 1;
    repeated FluctuationInfo     data = 2;
    civilpro.common.PageInfo     page = 3;
}

message GetAnnualBirthDeathResponse {
    civilpro.common.GrpcResponse meta         = 1;
    int64                        total_births = 2;
    int64                        total_deaths = 3;
    int32                        year         = 4;
}

// ================================================================
// SERVICE DEFINITION
// ================================================================

service FluctuationGrpcService {

    rpc GetMonthlyFluctuations (GetMonthlyFluctuationsRequest)
        returns (GetMonthlyFluctuationsResponse);

    rpc GetFluctuations (GetFluctuationsRequest)
        returns (GetFluctuationsResponse);

    rpc GetAnnualBirthDeath (GetAnnualBirthDeathRequest)
        returns (GetAnnualBirthDeathResponse);
}
