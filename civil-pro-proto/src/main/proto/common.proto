syntax = "proto3";

package civilpro.common;

option java_multiple_files  = true;
option java_package         = "vn.civil.grpc.common";
option java_outer_classname = "CommonProto";

message GrpcResponse {
  bool   success = 1;
  int32  code    = 2;
  string message = 3;
}

message DateRange {
  string from_date = 1;
  string to_date   = 2;
}

message PageRequest {
  int32  page     = 1;
  int32  size     = 2;
  string sort_by  = 3;
  string sort_dir = 4;
}

message PageInfo {
  int32 current_page    = 1;
  int32 page_size       = 2;
  int64 total_elements  = 3;
  int32 total_pages     = 4;
}

message EmptyRequest {}
